name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test (race, coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic -timeout 10m ./...

      - name: Test without YAML support
        run: go test -tags no_yaml -timeout 10m ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-layout

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Go files are not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags no_yaml ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run every example
        run: |
          status=0
          for d in examples/*/ examples/fluent/*/; do
            if [ -f "$d/main.go" ]; then
              go run "./$d" > /dev/null || { echo "FAIL $d"; status=1; }
            fi
          done
          exit $status

  wpt:
    name: WPT Examples (nested module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: wpt/go.mod
          cache-dependency-path: wpt/go.sum

      - name: Test
        working-directory: wpt
        run: go test -timeout 5m ./...
